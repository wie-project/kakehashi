[package]
name = "kh-xcrun"
version = "0.1.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Clean-room guest xcrun for the Kakehashi bottle (not Apple code)"
publish = false

# Guest `/usr/bin/xcrun` product. Built freestanding-style (`no_std` binary)
# for aarch64-apple-darwin so it only needs freestanding libSystem exports
# (not full Apple/libSystem + Rust std). Host unit tests live in the lib target
# with `std` via `cfg(test)`.
[lib]
name = "kh_xcrun"
path = "src/lib.rs"
# Host tests need std; product binary is no_std.
test = true
doctest = false

[[bin]]
name = "xcrun"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true
