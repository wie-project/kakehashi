[package]
name = "kh-libsystem"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "License-clean libSystem.B.dylib stubs for the Kakehashi bottle (not Apple code)"
publish = false

# Crate name must be a valid Rust identifier. Ship as `libSystem.B.dylib` after
# rename + `install_name_tool -id /usr/lib/libSystem.B.dylib`.
[lib]
name = "kh_libsystem"
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
# Intentionally empty: freestanding guest stubs (no host libSystem / libc body).

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
