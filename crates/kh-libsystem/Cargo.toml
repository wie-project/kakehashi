[package]
name = "kh-libsystem"
version = "0.1.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "License-clean libSystem.B.dylib stubs for the Kakehashi bottle (not Apple code)"
publish = false

# Crate name must be a valid Rust identifier. Not published (`publish = false`).
# Build product is renamed/id-patched by `./scripts/stage-libsystem.sh` into
# the crates.io embed `crates/kh-runtime/resources/`.
[lib]
name = "kh_libsystem"
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
# Pure Rust DEFLATE for freestanding zlib (Apple git object store).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# Note: do **not** add regex-automata here — workspace feature-unification with
# tracing-subscriber/matchers enables its `std` feature and collides with our
# freestanding `#[panic_handler]`. POSIX regex is host-side (`KH_HELPER_REG*`).

[build-dependencies]
cc = "1.2"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
