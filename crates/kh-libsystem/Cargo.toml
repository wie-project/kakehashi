[package]
name = "kh-libsystem"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "License-clean libSystem.B.dylib stubs for the Kakehashi bottle (not Apple code)"
publish = false

# Crate name must be a valid Rust identifier. Not published (`publish = false`).
# Build product is renamed/id-patched by `./scripts/stage-libsystem.sh` into
# the crates.io embed `crates/kh-runtime/resources/`.
[lib]
name = "kh_libsystem"
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
# Intentionally empty: freestanding guest stubs (no host libSystem / libc body).

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
