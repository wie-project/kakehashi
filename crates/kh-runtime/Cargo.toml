[package]
name = "kh-runtime"
version = "0.1.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/wie-project/kakehashi"
documentation = "https://docs.rs/kh-runtime"
description = "Kakehashi native ARM64 execution context, memory layout, traps, and bottle"
readme = "../../README.md"
keywords = ["macos", "darwin", "arm64", "syscalls"]
categories = ["emulators", "os"]
# Freestanding guest libSystem is vendored under resources/ and embedded via
# include_bytes! so crates.io packages can `kh bottle ensure` without a separate
# dylib. Refresh with: ./scripts/stage-libsystem.sh
# (Cargo packages this path by default; do not add exclude patterns that drop it.)

[dependencies]
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
plist = { workspace = true }
flate2 = { workspace = true }
liblzma = { workspace = true }

[lints]
workspace = true
